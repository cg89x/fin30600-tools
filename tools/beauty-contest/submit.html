<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beauty Contest — Submit · FIN 30600</title>
  <link rel="stylesheet" href="../../lib/style.css">
  <!-- Deliberately NO MathJax on this page — keep the student phone page tiny. -->
  <style>
    /* the flex display rules below would beat the UA [hidden] style */
    [hidden] { display: none !important; }
    .submit-main {
      max-width: 420px;
      margin: 0 auto;
      padding: 1.2rem 1.1rem 3rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .instructions { margin: 0; font-size: 1rem; line-height: 1.4; }
    .instructions strong { color: var(--navy); }

    .status-line {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--muted);
      min-height: 1.2em;
    }
    .status-line.open { color: var(--blue); }
    .status-line.closed { color: var(--red); }

    .field { display: flex; flex-direction: column; gap: 0.35rem; }
    .field label { font-size: 0.85rem; font-weight: 700; color: var(--label); }
    .guess-input {
      font-family: inherit;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--navy);
      text-align: center;
      width: 100%;
      padding: 0.4rem 0.5rem;
      border: 2px solid var(--panel-border);
      border-radius: 10px;
      font-variant-numeric: tabular-nums;
    }
    .guess-input:focus { outline: none; border-color: var(--blue); }
    .guess-range { width: 100%; accent-color: var(--blue); height: 2rem; cursor: pointer; }
    .name-input {
      font-family: inherit;
      font-size: 1.05rem;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      width: 100%;
    }
    .code-input {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 1.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      text-align: center;
      width: 100%;
      padding: 0.45rem 0.5rem;
      border: 2px solid var(--panel-border);
      border-radius: 10px;
    }
    .big-btn {
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      background: var(--navy);
      border: none;
      border-radius: 10px;
      padding: 0.85rem 1rem;
      width: 100%;
      cursor: pointer;
    }
    .big-btn:hover:not(:disabled) { background: #143766; }
    .big-btn:disabled { opacity: 0.45; cursor: default; }

    .result {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--navy);
      text-align: center;
      padding: 1.2rem 0.5rem;
    }
    .result .sub { display: block; font-size: 0.9rem; font-weight: 400; color: var(--muted); margin-top: 0.4rem; }
    .error-line { color: var(--red); font-size: 0.9rem; font-weight: 700; min-height: 1.2em; margin: 0; }

    /* compact header on a phone */
    .app-header h1 { font-size: 1.15rem; }
    .app-header .subtitle { font-size: 0.58rem; }
  </style>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
</head>
<body>
  <header class="app-header">
    <div class="titles">
      <h1>Keynesian Beauty Contest</h1>
      <p class="subtitle">FIN 30600 · Investment Theory — Lecture 6</p>
    </div>
  </header>

  <main class="submit-main">
    <p class="instructions">Pick a number between <strong>0 and 100</strong> —
      the guess closest to <strong>2/3 of the class average</strong> wins a prize!</p>

    <p class="status-line" id="status-line"></p>

    <!-- shown when the URL has no #s=CODE -->
    <div class="field" id="code-screen" hidden>
      <label for="code-input">Session code (on the screen)</label>
      <input class="code-input" id="code-input" maxlength="4" autocomplete="off"
             autocapitalize="characters" spellcheck="false" placeholder="ABCD">
      <button class="big-btn" id="btn-join">Join</button>
    </div>

    <!-- the guess form -->
    <div id="form-screen" hidden>
      <div class="field">
        <label for="guess-input">Your number</label>
        <input class="guess-input" id="guess-input" type="number" inputmode="decimal"
               min="0" max="100" step="0.1" value="50">
        <input class="guess-range" id="guess-range" type="range" min="0" max="100" step="0.5" value="50"
               aria-label="Your number (slider)">
      </div>
      <div class="field" style="margin-top:0.8rem;">
        <label for="name-input">First name</label>
        <input class="name-input" id="name-input" maxlength="24" autocomplete="given-name"
               placeholder="Ann" required>
      </div>
      <p class="error-line" id="error-line"></p>
      <button class="big-btn" id="btn-submit">Submit my guess</button>
    </div>

    <!-- post-submit / closed / unconfigured -->
    <div class="result" id="result-screen" hidden></div>
  </main>

  <script type="module" src="./submit.js"></script>
</body>
</html>
