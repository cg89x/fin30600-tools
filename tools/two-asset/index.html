<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Two-Asset Diversification · FIN 30600</title>
  <link rel="stylesheet" href="../../lib/style.css">
  <script>
    // MathJax v3 (tex-svg): manual rendering only — tools call renderTeX().
    window.MathJax = { startup: { typeset: false }, svg: { fontCache: 'local' } };
  </script>
  <script defer src="../../vendor/mathjax/tex-svg-full.js"></script>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <script type="module" src="../../lib/analytics.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="titles">
      <h1>Two-Asset Diversification Explorer</h1>
      <p class="subtitle">FIN 30600 · Investment Theory — Topic 3 §4 · University of Notre Dame</p>
    </div>
    <div class="header-actions">
      <a class="btn" href="../../">&larr; Back to all tools</a>
    </div>
  </header>

  <main class="tool-main" hidden>
    <aside class="controls-panel">
      <h2>Controls</h2>

      <div class="group">
        <div class="group-title">Security A</div>
        <div id="ctrl-muA"></div>
        <div id="ctrl-sigA"></div>
      </div>

      <div class="group">
        <div class="group-title">Security B</div>
        <div id="ctrl-muB"></div>
        <div id="ctrl-sigB"></div>
      </div>

      <div class="group">
        <div class="group-title">Portfolio</div>
        <div id="ctrl-rho"></div>
        <div id="ctrl-wA"></div>
        <div id="ctrl-shorts"></div>
        <div id="ctrl-refs"></div>
      </div>
    </aside>

    <div class="chart-area">
      <div class="formula-strip">
        <div class="formula-row"><span id="f-r1-sym"></span></div>
        <div class="formula-row"><span id="f-r1-num"></span></div>
        <div class="formula-row" style="margin-top:0.6rem;"><span id="f-r2-sym"></span></div>
        <div class="formula-row"><span id="f-r2-num"></span></div>
      </div>

      <div class="readouts">
        <div class="readout"><div class="k" data-label="$E[r_P]$"></div><div class="v blue" id="out-er">—</div></div>
        <div class="readout"><div class="k" data-label="$\sigma_P$"></div><div class="v blue" id="out-sd">—</div></div>
        <div class="readout"><div class="k" data-label="$\mathrm{Cov}(A, B)$"></div><div class="v" id="out-cov">—</div></div>
        <div class="readout"><div class="k" data-label="MVP weight $w_A^{\min}$"></div><div class="v gold" id="out-mvp">—</div></div>
      </div>

      <div class="chart-box" id="chart-box"></div>
    </div>
  </main>

  <footer class="app-footer">
    <span>FIN 30600 Investment Theory · Mendoza College of Business</span>
    <span><a href="../../">&larr; Back to the tool index</a></span>
  </footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
